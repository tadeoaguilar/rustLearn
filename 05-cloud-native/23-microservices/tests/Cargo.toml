[package]
name = "m23-microservices-tests"
description = "Tests for 23-microservices -- run against the solution or your own code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# cargo test -p m23-microservices-tests                   -> tests ../solution
# cargo test -p m23-microservices-tests --features mine   -> tests ../exercise (your code)
mine = []

[dependencies]
m23-microservices = { path = "../exercise" }
m23-microservices-solution = { path = "../solution" }

[dev-dependencies]
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
rand.workspace = true
