# Scrapes the two services started with
#   cargo run -p m24-observability-solution -- serve
# on your machine (host.docker.internal = the host, from inside Docker Desktop).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yaml        # generated: cargo run -p m24-observability-solution -- generate

scrape_configs:
  - job_name: frontend
    static_configs:
      - targets: ["host.docker.internal:3000"]
  - job_name: backend
    static_configs:
      - targets: ["host.docker.internal:3001"]
