[package]
name = "m22-kubernetes-operators-tests"
description = "Tests for 22-kubernetes-operators -- run against the solution or your own code"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
publish.workspace = true

[features]
# cargo test -p m22-kubernetes-operators-tests                   -> tests ../solution
# cargo test -p m22-kubernetes-operators-tests --features mine   -> tests ../exercise (your code)
mine = []

[dependencies]
m22-kubernetes-operators = { path = "../exercise" }
m22-kubernetes-operators-solution = { path = "../solution" }

[dev-dependencies]
tokio.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
