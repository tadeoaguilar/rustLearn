[package]
name = "m21-containerization-tests"
description = "Tests for 21-containerization -- run against the solution or your own code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# cargo test -p m21-containerization-tests                   -> tests ../solution
# cargo test -p m21-containerization-tests --features mine   -> tests ../exercise (your code)
mine = []

[dependencies]
m21-containerization = { path = "../exercise" }
m21-containerization-solution = { path = "../solution" }

[dev-dependencies]
tokio.workspace = true
reqwest.workspace = true
tempfile.workspace = true
