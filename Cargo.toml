# rustLearn -- one Cargo workspace for Phases 1-5 and 7-8 (Phase 6 has its own: 06-blockchain-solana/).
#
# Every module has three crates:
#
#   <module>/exercise   your code goes here           cargo run  -p mNN-<name> -- <part>
#   <module>/solution   the reference implementation  cargo run  -p mNN-<name>-solution -- <part>
#   <module>/tests      tests for either of the two   cargo test -p mNN-<name>-tests [--features mine]
#
# `cargo test` at the repository root runs every test against the reference
# solutions and should always be green. See GETTING_STARTED.md.
[workspace]
resolver = "3"
members = [
    "01-rust-fundamentals/*/exercise",
    "01-rust-fundamentals/*/solution",
    "01-rust-fundamentals/*/tests",
    "02-intermediate-rust/*/exercise",
    "02-intermediate-rust/*/solution",
    "02-intermediate-rust/*/tests",
    "02-intermediate-rust/*/*/crates/*",
    "03-advanced-rust/*/exercise",
    "03-advanced-rust/*/solution",
    "03-advanced-rust/*/tests",
    "03-advanced-rust/*/*/derive",
    "04-web-development/*/exercise",
    "04-web-development/*/solution",
    "04-web-development/*/tests",
    "05-cloud-native/*/exercise",
    "05-cloud-native/*/solution",
    "05-cloud-native/*/tests",
    "07-systems-programming/*/exercise",
    "07-systems-programming/*/solution",
    "07-systems-programming/*/tests",
    "08-advanced-topics/*/exercise",
    "08-advanced-topics/*/solution",
    "08-advanced-topics/*/tests",
    "08-advanced-topics/*/*/core",
    "08-advanced-topics/*/*/derive",
]
# The CRUD project is a standalone application with its own Cargo.lock, and
# Phase 6 (Solana) is its own workspace; build each from inside its directory.
exclude = ["10-crud-api-project", "06-blockchain-solana"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace.dependencies]
rand = "0.8"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["fs"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", features = ["ws", "macros"] }
rayon = "1"
crossbeam = "0.8"
proptest = "1"
mockall = "0.13"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
cc = "1"
tempfile = "3"

# Phase 4: web development
actix-web = "4"
askama = "0.16"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "timeout", "set-header"] }
axum-extra = { version = "0.12", features = ["cookie", "cookie-private", "typed-header"] }
utoipa = { version = "6", features = ["axum_extras"] }
validator = { version = "0.21", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.6"
tokio-tungstenite = "0.30"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"

# Phase 5: cloud native
serde_yaml_ng = "0.10"
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
schemars = "1"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "registry"] }
prometheus-client = "0.25"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.14"
x509-parser = "0.18"

# Phase 7: systems programming
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
regex = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
sysinfo = "0.36"
embedded-hal = "1"
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }
heapless = "0.9"
nix = { version = "0.31", features = ["signal", "process", "resource"] }
signal-hook = "0.4"
memmap2 = "0.9"

# Phase 8: advanced topics
wasm-bindgen = "0.2"

# Module 36: a profile for small binaries. Measure with
#   cargo build --release -p <pkg>  vs  cargo build --profile min-size -p <pkg>
[profile.min-size]
inherits = "release"
opt-level = "z"      # optimize for size
lto = true           # whole-program optimization: drop unused code across crates
codegen-units = 1    # fewer units: better optimization, slower builds
panic = "abort"      # no unwinding tables or landing pads
strip = true         # no symbols

# Argon2 is deliberately slow; unoptimised (debug) it's ~10x slower still,
# which makes module 19's tests crawl. Optimising just these dependencies
# keeps debug builds of our own code fast to compile.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
