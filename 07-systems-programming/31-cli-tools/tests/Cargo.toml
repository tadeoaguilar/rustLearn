[package]
name = "m31-cli-tools-tests"
description = "Tests for 31-cli-tools -- run against the solution or your own code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# cargo test -p m31-cli-tools-tests                   -> tests ../solution
# cargo test -p m31-cli-tools-tests --features mine   -> tests ../exercise (your code)
mine = []

[dependencies]
m31-cli-tools = { path = "../exercise" }
m31-cli-tools-solution = { path = "../solution" }

[dev-dependencies]
clap.workspace = true
clap_complete.workspace = true
regex.workspace = true
ratatui.workspace = true
serde_json.workspace = true
tempfile.workspace = true
