[package]
name = "m33-embedded-rust-tests"
description = "Tests for 33-embedded-rust -- run against the solution or your own code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# cargo test -p m33-embedded-rust-tests                   -> tests ../solution
# cargo test -p m33-embedded-rust-tests --features mine   -> tests ../exercise (your code)
mine = []

[dependencies]
m33-embedded-rust = { path = "../exercise" }
m33-embedded-rust-solution = { path = "../solution" }

[dev-dependencies]
embedded-hal.workspace = true
embedded-hal-mock.workspace = true
