[package]
name = "m01-getting-started-solution"
description = "Reference solution for 01-getting-started"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Exercise 1 + Bonus: build.rs captures the compiler version and build time.
