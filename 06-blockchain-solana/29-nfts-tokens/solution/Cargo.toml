[package]
name = "m29-nfts-tokens-solution"
description = "Reference solution for 29-nfts-tokens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# cdylib: what `cargo build-sbf` turns into a deployable .so; lib: for tests.
[lib]
crate-type = ["cdylib", "lib"]

# Only for `cargo build-sbf`: which program gets the on-chain entrypoint.
[features]
metadata = []
vending = []
nft-staking = []

[dependencies]
solana-program.workspace = true
solana-system-interface.workspace = true
spl-token-interface.workspace = true
borsh.workspace = true
thiserror.workspace = true

# Client side (Exercise 1, the bonus's off-chain tree) never runs on-chain.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solsim.workspace = true

[lints]
workspace = true
