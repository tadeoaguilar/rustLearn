[package]
name = "m26-solana-basics-solution"
description = "Reference solution for 26-solana-basics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# cdylib: what `cargo build-sbf` turns into a deployable .so; lib: for tests.
[lib]
crate-type = ["cdylib", "lib"]

# Only for `cargo build-sbf`: which program gets the on-chain entrypoint
# (one per .so). Native tests call each program's `process` directly.
[features]
hello = []
notes = []
vault = []

[dependencies]
solana-program.workspace = true
solana-system-interface.workspace = true
solana-sdk-ids.workspace = true
borsh.workspace = true
thiserror.workspace = true

# Client-side code (wallets, sending transactions) never runs on-chain.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solsim.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-signature.workspace = true
serde_json.workspace = true

[lints]
workspace = true
