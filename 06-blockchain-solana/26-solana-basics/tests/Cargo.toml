[package]
name = "m26-solana-basics-tests"
description = "Tests for 26-solana-basics -- run against the solution or your own code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# cargo test -p m26-solana-basics-tests                   -> tests ../solution
# cargo test -p m26-solana-basics-tests --features mine   -> tests ../exercise (your code)
mine = []
# The optional on-chain track: also run the programs built by ../../build-sbf.sh
# in LiteSVM. `--features sbf` (solution) or `--features sbf,mine` (yours).
sbf = ["solsim/sbf"]

[dependencies]
m26-solana-basics = { path = "../exercise" }
m26-solana-basics-solution = { path = "../solution" }

[dev-dependencies]
solsim.workspace = true
solana-program.workspace = true
solana-sdk-ids.workspace = true
solana-signer.workspace = true
borsh.workspace = true
serde_json.workspace = true

[lints]
workspace = true
