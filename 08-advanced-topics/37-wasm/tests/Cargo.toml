[package]
name = "m37-wasm-tests"
description = "Tests for 37-wasm -- run against the solution or your own code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# cargo test -p m37-wasm-tests                   -> tests ../solution
# cargo test -p m37-wasm-tests --features mine   -> tests ../exercise (your code)
mine = []

[dependencies]
m37-wasm = { path = "../exercise" }
m37-wasm-solution = { path = "../solution" }

[dev-dependencies]
tempfile.workspace = true
