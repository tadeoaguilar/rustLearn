[package]
name = "m39-compiler-internals"
description = "YOUR WORKSPACE for 39-compiler-internals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Doc examples would run against todo!() bodies, so they are off here.
[lib]
doctest = false

[dependencies]
syn = { workspace = true, features = ["visit", "visit-mut"] }
quote.workspace = true
# line/column numbers for spans outside a proc macro (the lint tool's output)
proc-macro2 = { workspace = true, features = ["span-locations"] }
serde_json.workspace = true
tempfile.workspace = true
