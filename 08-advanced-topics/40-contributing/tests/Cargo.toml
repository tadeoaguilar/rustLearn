[package]
name = "m40-contributing-tests"
description = "Tests for 40-contributing -- run against the solution or your own code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# cargo test -p m40-contributing-tests                   -> tests ../solution
# cargo test -p m40-contributing-tests --features mine   -> tests ../exercise (your code)
mine = []

[dependencies]
m40-contributing = { path = "../exercise" }
m40-contributing-solution = { path = "../solution" }

[dev-dependencies]
serde_yaml_ng.workspace = true
