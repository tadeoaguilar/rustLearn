[package]
name = "m08-modules-crates-tests"
description = "Tests for 08-modules-crates -- run against the solution or your own code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# cargo test -p m08-modules-crates-tests                   -> tests ../solution
# cargo test -p m08-modules-crates-tests --features mine   -> tests ../exercise (your code)
mine = []

# All of the bookstore's features are switched on for the tests, so they can
# check the JSON export and the report too.
[dependencies]
m08-modules-crates = { path = "../exercise", features = ["json", "report"] }
m08-modules-crates-solution = { path = "../solution", features = ["json", "report"] }
m08-money = { path = "../exercise/crates/money" }
m08-money-solution = { path = "../solution/crates/money" }
serde_json.workspace = true
