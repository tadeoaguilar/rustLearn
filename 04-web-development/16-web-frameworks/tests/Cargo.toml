[package]
name = "m16-web-frameworks-tests"
description = "Tests for 16-web-frameworks -- run against the solution or your own code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# cargo test -p m16-web-frameworks-tests                   -> tests ../solution
# cargo test -p m16-web-frameworks-tests --features mine   -> tests ../exercise (your code)
mine = []

[dependencies]
m16-web-frameworks = { path = "../exercise" }
m16-web-frameworks-solution = { path = "../solution" }

[dev-dependencies]
actix-web.workspace = true
axum.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
