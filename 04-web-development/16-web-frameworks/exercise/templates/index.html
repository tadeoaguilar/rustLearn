{% extends "base.html" %}
{% block content %}
<h1>Posts</h1>
{% if posts.is_empty() %}
  <p class="empty">No posts yet. <a href="/blog/new">Write the first one.</a></p>
{% else %}
  <ul class="posts">
  {% for post in posts %}
    <li><a href="/blog/{{ post.slug }}">{{ post.title }}</a> <small>{{ post.word_count() }} words</small></li>
  {% endfor %}
  </ul>
{% endif %}
{% endblock %}
