{% extends "base.html" %}
{% block title %}New post · Rust Blog{% endblock %}
{% block content %}
<h1>New post</h1>
{% if let Some(message) = error %}
  <p class="error">{{ message }}</p>
{% endif %}
<form method="post" action="/blog">
  <label>Title <input name="title" value="{{ title }}"></label>
  <label>Body <textarea name="body" rows="8">{{ body }}</textarea></label>
  <button type="submit">Publish</button>
</form>
{% endblock %}
